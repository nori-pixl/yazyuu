<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aoudio Script IDE</title>
<style>
:root{--side:#1b2431;--side2:#263344;--ink:#1b2431;--bg:#eaf0f6;--acc:#2f6bff;--mut:#7d8ca1}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:14px/1.5 "Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:flex;height:100%}
aside{width:260px;background:var(--side);color:#dbe5f2;display:flex;flex-direction:column;flex:none}
aside h1{font-size:15px;margin:0;padding:14px 14px 10px;letter-spacing:.04em}
button{font:inherit;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;background:var(--acc);color:#fff}
button:disabled{opacity:.4;cursor:default}
button.g{background:var(--side2);color:#dbe5f2}
button:focus-visible,textarea:focus-visible,li:focus-visible,summary:focus-visible{outline:2px solid #8fb0ff;outline-offset:1px}
#open{margin:0 14px 10px}
#tree{flex:1;overflow:auto;padding:0 6px 14px;font-size:13px}
#tree ul{list-style:none;margin:0;padding-left:14px}
#tree>ul{padding-left:0}
#tree li,#tree summary{padding:2px 8px;border-radius:4px;cursor:pointer;white-space:nowrap}
#tree li:hover,#tree summary:hover{background:var(--side2)}
#tree li.on{background:var(--acc);color:#fff}
#tree li.dim{color:#66758a;cursor:default}
#tree li.dim:hover{background:none}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #cfd9e5;background:#f6f9fc}
#name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ed{flex:1;width:100%;border:0;resize:none;padding:14px;font:14px/1.7 ui-monospace,"Noto Sans Mono",monospace;background:#fff;color:var(--ink);tab-size:2}
#stat{padding:5px 12px;font-size:12px;border-top:1px solid #cfd9e5;background:#f6f9fc;color:var(--mut);min-height:28px}
#stat.err{color:#c4262e}
@media(max-width:640px){#app{flex-direction:column}aside{width:100%;height:36%}}
</style>
</head>
<body>
<div id="app">
<aside>
 <h1>Aoudio Script</h1>
 <button id="open">フォルダを開く</button>
 <div id="tree"></div>
</aside>
<main>
 <div id="bar">
  <span id="name">ファイルを選んでください (.as / .asl)</span>
  <button id="run" disabled>再生</button>
  <button id="stop" class="g" disabled>停止</button>
  <button id="save" class="g" disabled>保存</button>
 </div>
 <textarea id="ed" spellcheck="false" disabled placeholder="左の「フォルダを開く」から .as / .asl を選ぶと編集できます。

.asl (音階リスト)          .as (JavaScript)
@wave triangle             tempo(120);
C4:1 E4:1 G4:2             const m = load('melody.asl');
C4+E4+G4:4 R:1             repeat(2, () => play(m));
; コメント                   par(m, note('C3', 4));"></textarea>
 <div id="stat">Ctrl+S 保存 / Ctrl+Enter 再生</div>
</main>
</div>
<script>
/* Aoudio Script v2.0  — 関数ライブラリ。.as はただの JavaScript です。
 * .asl : 音階リスト   例) C4:1 E4+G4:0.5 R:1 ; ';'以降はコメント
 *        音名[+音名...]:長さ(拍。1/2 のような分数も可)  R=休符  @wave square / @volume 0.2 でファイル別の音色
 * .as  : JavaScript。次の関数が使えます
 *        tempo(120) wave('square') volume(0.3) transpose(2)
 *        load('a.asl') note('C4+E4', 2) asl('C4:1 D4:1')   ← 音のまとまりを作る
 *        play(a, b, ...) 順に再生 / par(a, b) 同時に再生 / rest(1) / repeat(2, i => play(a))
 * HTML から: Aoudio.play(asCode, name => aslText)  → {stop(), duration, ended}
 */
const Aoudio = (() => {
  const N = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function pitch(s) {
    if (/^(r|rest|-)$/i.test(s)) return null;
    const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(s);
    if (!m) throw Error('音名が不正です: ' + s);
    return (+m[3] + 1) * 12 + N[m[1].toUpperCase()] + (m[2] == '#' ? 1 : m[2] == 'b' ? -1 : 0);
  }
  function dur(s) {
    if (s == null || s === '') return 1;
    const m = /^(\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?$/.exec(s);
    if (!m) throw Error('長さが不正です: ' + s);
    return m[2] ? m[1] / m[2] : +m[1];
  }
  function parseASL(text) {
    const o = { wave: null, volume: null, events: [], beats: 0 };
    text.split(/\r?\n/).forEach((raw, i) => {
      const line = raw.replace(/;.*/, '').trim();
      if (!line) return;
      if (line[0] == '@') { const [k, v] = line.slice(1).split(/\s+/); o[k] = isNaN(v) ? v : +v; return; }
      for (const tok of line.split(/\s+/)) {
        try {
          const [p, d] = tok.split(':'), b = dur(d);
          o.events.push({ notes: p.split('+').map(pitch).filter(x => x != null), beats: b, at: o.beats });
          o.beats += b;
        } catch (e) { throw Error((i + 1) + '行目: ' + e.message); }
      }
    });
    return o;
  }
  function compile(code, resolve) {
    const S = { tempo: 120, wave: 'square', volume: 0.3, tr: 0 }, out = [], cache = {};
    let t = 0;
    const spb = () => 60 / S.tempo;
    const load = n => typeof n == 'string' ? (cache[n] = cache[n] || parseASL(resolve(n))) : n;
    function sched(f, at) {
      f = load(f);
      for (const e of f.events) for (const m of e.notes)
        out.push({ time: at + e.at * spb(), dur: e.beats * spb(), midi: m + S.tr, wave: f.wave || S.wave, vol: f.volume ?? S.volume });
      return f.beats * spb();
    }
    const api = {
      tempo: v => { S.tempo = v; }, wave: v => { S.wave = v; }, volume: v => { S.volume = v; }, transpose: v => { S.tr = v; },
      load, asl: parseASL, note: (n, b = 1) => parseASL(n + ':' + b),
      play: (...a) => { for (const f of a) t += sched(f, t); },
      par: (...a) => { let m = 0; for (const f of a) m = Math.max(m, sched(f, t)); t += m; },
      rest: b => { t += b * spb(); },
      repeat: (n, fn) => { for (let i = 0; i < n; i++) fn(i); },
    };
    new Function(...Object.keys(api), code)(...Object.values(api));
    return { notes: out, duration: Math.max(t, ...out.map(n => n.time + n.dur), 0) };
  }
  function play(asText, resolve, ctx) {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state == 'suspended') ctx.resume();
    const { notes, duration } = compile(asText, resolve), t0 = ctx.currentTime + 0.1, nodes = [];
    const master = ctx.createGain();
    master.connect(ctx.destination);
    for (const n of notes) {
      const o = ctx.createOscillator(), g = ctx.createGain(), s = t0 + n.time, e = s + Math.max(n.dur, 0.04);
      o.type = n.wave;
      o.frequency.value = 440 * Math.pow(2, (n.midi - 69) / 12);
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(n.vol, s + 0.01);
      g.gain.setValueAtTime(n.vol, e - 0.02);
      g.gain.linearRampToValueAtTime(0, e);
      o.connect(g).connect(master);
      o.start(s); o.stop(e + 0.01);
      nodes.push(o);
    }
    return {
      duration, notes,
      stop() { master.disconnect(); nodes.forEach(o => { try { o.stop(); } catch (e) {} }); },
      ended: new Promise(r => setTimeout(r, (duration + 0.3) * 1000)),
    };
  }
  return { pitch, parseASL, compile, play };
})();
if (typeof module !== 'undefined') module.exports = Aoudio;

</script>
<script>
const $=id=>document.getElementById(id);
const ed=$('ed'),stat=$('stat');
let files={},cur=null,dirty=false,player=null;
const isAS=n=>/\.as$/i.test(n),editable=n=>/\.(as|asl)$/i.test(n);
function msg(t,err){stat.textContent=t;stat.className=err?'err':''}

$('open').onclick=async()=>{
  if(!window.showDirectoryPicker)return msg('このブラウザはフォルダ編集に未対応です。Chrome か Edge で開いてください。',1);
  try{
    const root=await showDirectoryPicker({mode:'readwrite'});
    files={};cur=null;ed.value='';ed.disabled=true;
    const ul=document.createElement('ul');
    $('tree').replaceChildren(ul);
    await walk(root,ul,'');
    msg('「'+root.name+'」を開きました');
  }catch(e){if(e.name!='AbortError')msg(e.message,1)}
};
async function walk(dir,ul,path){
  const items=[];
  for await(const [,h] of dir.entries())if(h.name[0]!='.'&&h.name!='node_modules')items.push(h);
  items.sort((a,b)=>a.kind==b.kind?a.name.localeCompare(b.name):a.kind=='directory'?-1:1);
  for(const h of items){
    const li=document.createElement('li');
    if(h.kind=='directory'){
      const d=document.createElement('details'),s=document.createElement('summary'),sub=document.createElement('ul');
      s.textContent=h.name;d.append(s,sub);li.append(d);li.style.padding=0;
      await walk(h,sub,path+h.name+'/');
    }else{
      const p=path+h.name;li.textContent=h.name;
      if(editable(h.name)){files[p]=h;li.tabIndex=0;li.dataset.p=p;li.onclick=()=>openFile(p);li.onkeydown=e=>e.key=='Enter'&&openFile(p)}
      else li.className='dim';
    }
    ul.append(li);
  }
}
async function openFile(p){
  if(dirty&&!confirm('保存していない変更があります。破棄しますか?'))return;
  ed.value=await (await files[p].getFile()).text();
  cur=p;dirty=false;ed.disabled=false;$('save').disabled=false;$('run').disabled=false;
  $('name').textContent=p;
  document.querySelectorAll('#tree li').forEach(l=>l.classList.toggle('on',l.dataset.p==p));
  msg(isAS(p)?'.as — JavaScript (Aoudio の関数が使えます)':'.asl — 音階リスト');
}
async function save(){
  if(!cur)return;
  const w=await files[cur].createWritable();await w.write(ed.value);await w.close();
  dirty=false;$('name').textContent=cur;msg('保存しました');
}
function find(name){
  const norm=s=>s.replace(/^\.\//,'');
  const dir=cur.includes('/')?cur.replace(/\/[^/]*$/,'/'):'';
  name=norm(name);
  return [dir+name,name,...Object.keys(files).filter(k=>k.endsWith('/'+name))].find(k=>files[k]);
}
async function run(){
  stopPlay();
  try{
    if(dirty)await save();
    let src,cache={};
    if(isAS(cur)){
      src=ed.value;
      for(const m of src.matchAll(/load\(\s*['"`]([^'"`]+)['"`]/g)){
        const k=find(m[1]);
        if(!k)throw Error('ファイルが見つかりません: '+m[1]);
        cache[m[1]]=await (await files[k].getFile()).text();
      }
    }else{src="play(load('f.asl'))";cache['f.asl']=ed.value}
    player=Aoudio.play(src,n=>cache[n]);
    $('stop').disabled=false;msg('再生中 ('+player.duration.toFixed(1)+' 秒, '+player.notes.length+' 音)');
    const mine=player;mine.ended.then(()=>{if(player===mine){stopPlay();msg('再生が終わりました')}});
  }catch(e){msg(e.message,1)}
}
function stopPlay(){if(player){player.stop();player=null}$('stop').disabled=true}
$('run').onclick=run;$('stop').onclick=()=>{stopPlay();msg('停止しました')};$('save').onclick=()=>save().catch(e=>msg(e.message,1));
ed.oninput=()=>{dirty=true;$('name').textContent=cur+' ●'};
ed.onkeydown=e=>{
  if(e.key=='Tab'){e.preventDefault();document.execCommand('insertText',false,'  ')}
  if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();save().catch(x=>msg(x.message,1))}
  if((e.ctrlKey||e.metaKey)&&e.key=='Enter'){e.preventDefault();run()}
};
</script>
</body>
</html>
