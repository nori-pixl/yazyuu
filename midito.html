<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MID → Aoudio Script 変換</title>
<style>
:root{--ink:#1b2431;--acc:#2f6bff;--mut:#7d8ca1}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 "Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:#eaf0f6}
main{max-width:720px;margin:0 auto;padding:32px 18px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 18px;color:var(--mut)}
#drop{display:block;border:2px dashed #9db2cf;border-radius:10px;padding:34px 16px;text-align:center;background:#f6f9fc;cursor:pointer}
#drop.on,#drop:focus-within{border-color:var(--acc);background:#fff}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
label.o{display:block;margin:14px 0}
button{font:inherit;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;background:var(--acc);color:#fff}
button:focus-visible,summary:focus-visible{outline:2px solid #8fb0ff;outline-offset:2px}
#out{margin-top:16px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
details{background:#fff;border-radius:8px;margin-bottom:8px;padding:8px 12px}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px}
pre{margin:8px 0 0;max-height:220px;overflow:auto;font:13px/1.6 ui-monospace,"Noto Sans Mono",monospace;white-space:pre-wrap}
#err{color:#c4262e}
</style>
</head>
<body>
<main>
<h1>MID → Aoudio Script</h1>
<p>MIDI ファイルを .as(JavaScript)に変換します。全トラックを開始・長さ・ドラム・音高・楽器・音量の1行1音にまとめ、Scratch の音楽拡張と同じ楽器番号・ドラム番号で書き出します。</p>
<label id="drop"><input type="file" id="f" accept=".mid,.midi">MIDI ファイルをここにドロップ、またはクリックして選択</label>
<label class="o"><input type="checkbox" id="drum" checked> ドラム(チャンネル10)も変換する</label>
<label class="o"><input type="checkbox" id="sep"> 音符データを .asl に分けて出す(オフなら .as だけで鳴ります)</label>
<div id="err"></div>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const NM=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nm=m=>NM[m%12]+(Math.floor(m/12)-1);
const WAVES=['square','triangle','sawtooth','sine'];
let last=null;

const DRUM={35:2,36:2,38:1,40:1,37:3,39:8,42:6,44:6,46:5,49:4,52:4,55:4,57:4,51:5,53:5,59:5,41:14,43:14,45:14,47:13,48:13,50:13,54:7,56:11,75:9,76:10,77:10,81:12,80:12,73:16,74:16,69:15,70:15,58:17,78:18,79:18,60:13,61:13,62:14,63:14,64:14};
const INST=p=>p>=4&&p<=7?2:p==11?16:p==12||p==13?19:p==45?7:p>=26&&p<=31?5:p>=52&&p<=54?15:p==55?21:p>=48&&p<=51?8:p==68||p==69||p==71?10:p==70?14:p>=75&&p<=77?13:[1,17,3,4,6,8,8,9,11,12,20,21,21,4,18,1][p>>3];

function parseMidi(buf){
  const d=new DataView(buf);let p=0;
  const str=n=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(d.getUint8(p++));return s};
  const u32=()=>{const v=d.getUint32(p);p+=4;return v},u16=()=>{const v=d.getUint16(p);p+=2;return v};
  const vlq=()=>{let v=0,b;do{b=d.getUint8(p++);v=v<<7|b&127}while(b&128);return v};
  if(str(4)!='MThd')throw Error('MIDI ファイルではありません');
  u32();u16();const nt=u16(),div=u16();
  if(div&0x8000)throw Error('SMPTE 形式の MIDI には未対応です');
  const tm=[],notes=[];
  for(let k=0;k<nt;k++){
    if(str(4)!='MTrk')throw Error('トラックが壊れています');
    const end=u32()+p,on={},prog={};let t=0,run=0;
    while(p<end){
      t+=vlq();let s=d.getUint8(p);
      if(s&128){p++;if(s<0xF0)run=s}else s=run;
      if(s==0xFF){
        const ty=d.getUint8(p++),l=vlq();
        if(ty==0x51)tm.push([t,d.getUint8(p)<<16|d.getUint8(p+1)<<8|d.getUint8(p+2)]);
        p+=l;
      }else if(s==0xF0||s==0xF7){p+=vlq()}
      else{
        const hi=s>>4,ch=s&15,a=d.getUint8(p++),b=(hi==0xC||hi==0xD)?0:d.getUint8(p++),key=ch*128+a;
        if(hi==0xC)prog[ch]=a;
        else if(hi==9&&b>0){
          if(on[key])notes.push({s:on[key][0],e:t,m:a,ch,v:on[key][1],i:on[key][2]});
          on[key]=[t,b,prog[ch]||0];
        }else if((hi==8||hi==9)&&on[key]){const o=on[key];notes.push({s:o[0],e:t,m:a,ch,v:o[1],i:o[2]});delete on[key]}
      }
    }
    p=end;
  }
  tm.sort((x,y)=>x[0]-y[0]);
  return{div,tm,notes};
}

function secFn(tm,div){
  const pts=tm.length&&tm[0][0]==0?tm:[[0,500000],...tm],seg=[];
  let sec=0,pt=0,us=500000;
  for(const [tk,u] of pts){sec+=(tk-pt)*us/div/1e6;pt=tk;us=u;seg.push([tk,sec,u])}
  return tick=>{let g=seg[0];for(const x of seg){if(x[0]<=tick)g=x;else break}return g[1]+(tick-g[0])*g[2]/div/1e6};
}

function convert(buf,base,drums,sep){
  const m=parseMidi(buf),S=secFn(m.tm,m.div),ev=[];
  for(const n of m.notes){
    const isD=n.ch==9;let p=n.m;
    if(isD){if(!drums||!DRUM[p])continue;p=DRUM[p]}
    const s=S(n.s);
    ev.push([s,Math.max(S(n.e)-s,0.01),isD?1:0,p,isD?1:INST(n.i),Math.max(1,Math.round(n.v/127*100))]);
  }
  if(!ev.length)throw Error('変換できる音符がありませんでした');
  ev.sort((a,b)=>a[0]-b[0]||a[3]-b[3]);
  const r=x=>+x.toFixed(4),bpm=Math.round(6e7/(m.tm[0]?m.tm[0][1]:500000)*100)/100;
  const head='; '+base+'.mid から変換\n; 開始秒 長さ秒 ドラム 音高 楽器 音量\n@bpm '+bpm+'\n';
  const rows=ev.map(e=>[r(e[0]),r(e[1]),e[2],e[3],e[4],e[5]].join(' ')).join('\n')+'\n';
  if(sep)return[{name:base+'.as',text:'// '+base+'.mid から変換\nsetTempo('+bpm+');\nplay(load('+JSON.stringify(base+'.asl')+'));\n'},{name:base+'.asl',text:head+rows}];
  return[{name:base+'.as',text:'// '+base+'.mid から変換 (音符データを中に含みます。.asl は不要です)\nsetTempo('+bpm+');\nplay(asl(`\n'+head+rows+'`));\n'}];
}

function show(files){
  last=files;const o=$('out');o.replaceChildren();
  const bar=document.createElement('div');bar.className='bar';
  const all=document.createElement('button');all.textContent='フォルダに全部保存';all.onclick=saveAll;
  const hint=document.createElement('span');hint.textContent=files.length+' ファイルができました';
  bar.append(all,hint);o.append(bar);
  for(const f of files){
    const d=document.createElement('details'),s=document.createElement('summary'),b=document.createElement('button'),pre=document.createElement('pre');
    const n=document.createElement('span');n.textContent=f.name;
    b.textContent='ダウンロード';b.onclick=e=>{e.preventDefault();download(f)};
    s.append(n,b);pre.textContent=f.text;d.append(s,pre);o.append(d);
  }
}
function download(f){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([f.text],{type:'text/plain'}));
  a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function saveAll(){
  if(!window.showDirectoryPicker){last.forEach((f,i)=>setTimeout(()=>download(f),i*250));return}
  try{
    const dir=await showDirectoryPicker({mode:'readwrite'});
    for(const f of last){const w=await(await dir.getFileHandle(f.name,{create:true})).createWritable();await w.write(f.text);await w.close()}
    $('err').textContent='';
  }catch(e){if(e.name!='AbortError')$('err').textContent=e.message}
}
async function load(file){
  $('err').textContent='';
  try{show(convert(await file.arrayBuffer(),file.name.replace(/\.[^.]+$/,''),$('drum').checked,$('sep').checked))}
  catch(e){$('err').textContent=e.message;$('out').replaceChildren()}
}
$('f').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
const dz=$('drop');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};
dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
</script>
</body>
</html>
